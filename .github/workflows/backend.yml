name: Backend

on:
  workflow_call:
    inputs:
      TEST_IN_PR:
        required: false
        type: string
        default: 'true'

concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  license-header:
    name: License header
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Check license header
        uses: apache/skywalking-eyes@v0.5.0

  code-style:
    name: Code style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Check code style
        run: ./mvnw --batch-mode --quiet --no-snapshot-updates clean spotless:check
      - name: Check code specification
        run: |
          ./mvnw -B -T 2C clean test \
            -D"license.skipAddThirdParty"=true \
            -pl seatunnel-ci-tools -am \
            --no-snapshot-updates
        env:
          MAVEN_OPTS: -Xmx512m
      - name: Check for .class files in git
        run: |
          echo "Checking for .class files tracked by git..."
          CLASS_FILES=$(git ls-files '*.class')
          if [ -n "$CLASS_FILES" ]; then
            echo "ERROR: The following .class files are tracked by git:"
            echo "$CLASS_FILES"
            exit 1
          else
            echo "No .class files found in git repository."
          fi

  helm-chart-check:
    name: Check Helm Chart Syntax
    needs: [ license-header, code-style ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Helm
        uses: azure/setup-helm@v4.3.0
      - name: Lint Chart
        run: helm lint deploy/kubernetes/seatunnel

  changes:
    name: Detect changed modules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      api:        ${{ steps.filter.outputs.api }}
      engine:     ${{ steps.filter.outputs.engine }}
      engine-e2e: ${{ steps.filter.outputs.engine-e2e }}
      docs:       ${{ steps.filter.outputs.docs }}
      ut-modules: ${{ steps.ut-modules.outputs.modules }}
      it-modules: ${{ steps.it-modules.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2000
      - name: Initialize git remote and detect current branch
        id: git_init
        run: |
          /usr/bin/git remote add apache https://github.com/apache/seatunnel
          /usr/bin/git -c protocol.version=2 fetch \
            --no-tags --prune --no-recurse-submodules --depth=2000 apache \
            +refs/heads/dev*:refs/remotes/apache/dev* \
            +refs/tags/dev*:refs/tags/dev*
          /usr/bin/git checkout apache/dev
          /usr/bin/git checkout '${{ github.ref }}'
          echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'
      - name: Detect file changes
        id: filter
        run: |
          pip install --quiet GitPython
          current_branch='${{ steps.git_init.outputs.branch }}'
          workspace="${GITHUB_WORKSPACE}"
          repository_owner="${GITHUB_REPOSITORY_OWNER}"
          run_check() {
            local output_prefix="$1"
            shift
            python tools/update_modules_check/check_file_updates.py \
              ua "$workspace" apache/dev "origin/$current_branch" "$@" \
              > /tmp/check_output.txt 2>/dev/null || true
            local changed
            changed=$(head -1 /tmp/check_output.txt)
            tail -n +2 /tmp/check_output.txt > "/tmp/files_${output_prefix}.txt"
            echo "${output_prefix}=${changed}" >> $GITHUB_OUTPUT
          }
          run_check "cv2"         "seatunnel-connectors-v2/**"
          run_check "cv2_e2e"     "seatunnel-e2e/seatunnel-connector-v2-e2e/**"
          run_check "engine"      "seatunnel-engine/**"
          run_check "engine_e2e"  "seatunnel-e2e/seatunnel-engine-e2e/**"
          run_check "docs"        "docs/**"
          python tools/update_modules_check/check_file_updates.py \
            d "$workspace" apache/dev "origin/$current_branch" "**/pom.xml" \
            > /tmp/check_output.txt 2>/dev/null || true
          echo "deleted_poms=$(head -1 /tmp/check_output.txt)" >> $GITHUB_OUTPUT
          tail -n +2 /tmp/check_output.txt > /tmp/files_deleted_poms.txt
          python tools/update_modules_check/check_file_updates.py \
            ua "$workspace" apache/dev "origin/$current_branch" \
            "seatunnel-api/" \
            "seatunnel-common/" \
            "seatunnel-config/" \
            "seatunnel-core/" \
            "seatunnel-e2e/seatunnel-e2e-common/" \
            "seatunnel-formats/" \
            "seatunnel-plugin-discovery/" \
            "seatunnel-transforms-v2/" \
            "seatunnel-translation/" \
            "seatunnel-e2e/seatunnel-transforms-v2-e2e/" \
            "pom.xml" \
            "/workflows/" \
            "tools/" \
            "seatunnel-dist/" \
            > /tmp/check_output.txt 2>/dev/null || true
          api_changed=$(head -1 /tmp/check_output.txt)
          if [[ "$repository_owner" == "apache" && "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            api_changed='true'
          fi
          echo "api=${api_changed}" >> $GITHUB_OUTPUT

      - name: Compute changed connector-v2 modules
        id: cv2-modules
        if: steps.filter.outputs.cv2 == 'true'
        run: |
          files=$(cat /tmp/files_cv2.txt)
          if [ -n "$files" ]; then
            result=$(python tools/update_modules_check/update_modules_check.py cv2 "$files")
            echo "modules=$result" >> $GITHUB_OUTPUT
          fi

      - name: Compute changed connector-v2-e2e modules
        id: cv2-e2e-modules
        if: steps.filter.outputs.cv2_e2e == 'true'
        run: |
          files=$(cat /tmp/files_cv2_e2e.txt)
          if [ -n "$files" ]; then
            result=$(python tools/update_modules_check/update_modules_check.py cv2-e2e "$files")
            echo "modules=$result" >> $GITHUB_OUTPUT
          fi

      - name: Compute changed engine modules
        id: engine-modules
        if: steps.filter.outputs.engine == 'true'
        run: |
          files=$(cat /tmp/files_engine.txt)
          if [ -n "$files" ]; then
            result=$(python tools/update_modules_check/update_modules_check.py engine "$files")
            echo "modules=$result" >> $GITHUB_OUTPUT
          fi

      - name: Compute changed engine-e2e modules
        id: engine-e2e-modules
        if: steps.filter.outputs.engine_e2e == 'true'
        run: |
          files=$(cat /tmp/files_engine_e2e.txt)
          if [ -n "$files" ]; then
            result=$(python tools/update_modules_check/update_modules_check.py engine-e2e "$files")
            echo "modules=$result" >> $GITHUB_OUTPUT
          fi

      - name: Compute deleted modules
        id: deleted-modules
        if: steps.filter.outputs.deleted_poms == 'true'
        run: |
          files=$(cat /tmp/files_deleted_poms.txt)
          if [ -n "$files" ]; then
            result=$(python tools/update_modules_check/update_modules_check.py delete "$files")
            echo "modules=$result" >> $GITHUB_OUTPUT
          fi

      - name: Compute unit test target modules
        id: ut-modules
        timeout-minutes: 60
        if: >-
          steps.filter.outputs.api == 'false' &&
          (steps.engine-modules.outputs.modules != '' ||
           steps.cv2-modules.outputs.modules != '')
        run: |
          modules='${{ steps.engine-modules.outputs.modules }}${{ steps.cv2-modules.outputs.modules }}'
          modules=${modules:1}
          pl_modules=$(python tools/update_modules_check/update_modules_check.py replace "$modules")
          delete_modules='${{ steps.deleted-modules.outputs.modules }}'
          if [ -n "$delete_modules" ]; then
            pl_modules=$(python tools/update_modules_check/update_modules_check.py rm \
              "$pl_modules" "$delete_modules")
          fi
          if [ -z "$pl_modules" ]; then
            echo "No unit test modules to run."
            exit 0
          fi
          ./mvnw help:evaluate \
            -Dexpression=project.modules -q -DforceStdout \
            -pl "$pl_modules" > /tmp/sub_module.txt
          sub_modules=$(python tools/update_modules_check/update_modules_check.py \
            sub /tmp/sub_module.txt)
          includes=$(python tools/update_modules_check/update_modules_check.py \
            tree "${modules}${sub_modules}")
          ./mvnw -Pci -D"e2e.dependency.skip"=false \
            dependency:tree $includes \
            -DoutputType=text -DoutputFile=/tmp/tree_out.txt
          build_modules=$(python tools/update_modules_check/update_modules_check.py \
            final_ut /tmp/tree_out.txt)
          if [ -z "$build_modules" ]; then
            build_modules="$pl_modules"
          fi
          echo "modules=$build_modules" >> $GITHUB_OUTPUT

      - name: Compute integration test target modules
        id: it-modules
        timeout-minutes: 60
        if: >-
          steps.filter.outputs.api == 'false' &&
          (steps.engine-modules.outputs.modules != '' ||
           steps.cv2-modules.outputs.modules != '' ||
           steps.cv2-e2e-modules.outputs.modules != '')
        run: |
          modules='${{ steps.cv2-e2e-modules.outputs.modules }}${{ steps.engine-e2e-modules.outputs.modules }}${{ steps.engine-modules.outputs.modules }}${{ steps.cv2-modules.outputs.modules }}'
          modules=${modules:1}
          pl_modules=$(python tools/update_modules_check/update_modules_check.py replace "$modules")
          delete_modules='${{ steps.deleted-modules.outputs.modules }}'
          if [ -n "$delete_modules" ]; then
            pl_modules=$(python tools/update_modules_check/update_modules_check.py rm \
              "$pl_modules" "$delete_modules")
          fi
          if [ -z "$pl_modules" ]; then
            echo "No integration test modules to run."
            exit 0
          fi
          ./mvnw help:evaluate \
            -Dexpression=project.modules -q -DforceStdout \
            -pl "$pl_modules" > /tmp/sub_module.txt
          sub_modules=$(python tools/update_modules_check/update_modules_check.py \
            sub /tmp/sub_module.txt)
          includes=$(python tools/update_modules_check/update_modules_check.py \
            tree "${modules}${sub_modules}")
          ./mvnw -Pci -D"e2e.dependency.skip"=false \
            dependency:tree $includes \
            -DoutputType=text -DoutputFile=/tmp/tree_out.txt
          build_modules=$(python tools/update_modules_check/update_modules_check.py \
            final_it /tmp/tree_out.txt)
          echo "modules=$build_modules" >> $GITHUB_OUTPUT

  build:
    name: Compile and Install
    needs: [ license-header, code-style, changes ]
    if: >-
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.engine == 'true' ||
      needs.changes.outputs.engine-e2e == 'true' ||
      needs.changes.outputs.ut-modules != '' ||
      needs.changes.outputs.it-modules != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build and install all modules
        run: |
          ./mvnw -B -T 2C clean install \
            -DskipTests \
            -D"license.skipAddThirdParty"=true \
            -D"skip.ui"=true \
            -Pci
      - name: Clean unnecessary artifacts before caching
        run: |
          cd ~/.m2/repository/org/apache/seatunnel
          find . -name "*-sources.jar"        -delete
          find . -name "*-javadoc.jar"        -delete
          find . -name "*-tests.jar"          -delete
          find . -name "_remote.repositories" -delete
          find . -name "*.lastUpdated"        -delete
          echo "Cached artifact size:"
          du -sh .
      - name: Save seatunnel build artifacts to cache
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository/org/apache/seatunnel
          key: seatunnel-m2-${{ github.run_id }}

  dependency-license:
    name: Check dependency licenses
    needs: [ build, changes ]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'
      - name: Restore build artifacts
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/apache/seatunnel
          key: seatunnel-m2-${{ github.run_id }}
          restore-keys: |
            seatunnel-m2-
      - name: Check dependency licenses
        run: |
          set -e
          echo "Starting license check..."
          tools/dependencies/checkLicense.sh
          echo "License check passed."

  document:
    name: Build documentation
    needs: [ changes ]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: seatunnel-pr
      - uses: actions/checkout@v4
        with:
          repository: apache/seatunnel-website
          path: seatunnel-website
      - name: Sync documents
        run: bash seatunnel-pr/tools/documents/sync.sh seatunnel-pr seatunnel-website
      - uses: actions/setup-node@v4
        with:
          node-version: 18.20.7
      - name: Build website
        run: |
          cd seatunnel-website
          npm set strict-ssl false
          npm install
          npm run build

  seatunnel-ui:
    name: Build SeaTunnel UI
    needs: [ changes ]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Lint, test and build UI
        run: |
          cd seatunnel-engine/seatunnel-engine-ui/
          npm install
          npm run lint
          npm run test:unit
          npm run build

  unit-test:
    name: Unit test (Java ${{ matrix.java }}, ${{ matrix.os }})
    needs: [ build, changes ]
    if: >-
      needs.changes.outputs.api == 'true' ||
      (needs.changes.outputs.api == 'false' &&
       needs.changes.outputs.ut-modules != '')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        java: [ '8', '11' ]
        os: [ 'ubuntu-latest', 'windows-latest' ]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'
      - name: Restore build artifacts
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/apache/seatunnel
          key: seatunnel-m2-${{ github.run_id }}
          restore-keys: |
            seatunnel-m2-
      - name: Run unit tests
        run: ./mvnw -B -T 2C verify -DskipUT=false -DskipIT=true -D"license.skipAddThirdParty"=true -D"skip.ui"=true --no-snapshot-updates
        env:
          MAVEN_OPTS: -Xmx4096m

  updated-modules-integration-test:
    name: Integration test - updated modules (Java ${{ matrix.java }}, partition ${{ matrix.partition }})
    needs: [ build, changes ]
    if: >-
      needs.changes.outputs.api == 'false' &&
      needs.changes.outputs.engine == 'false' &&
      needs.changes.outputs.it-modules != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '8', '11' ]
        partition: [ 0, 1, 2, 3, 4, 5, 6, 7 ]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'
      - name: Restore build artifacts
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/apache/seatunnel
          key: seatunnel-m2-${{ github.run_id }}
          restore-keys: |
            seatunnel-m2-
      - name: Free disk space
        run: tools/github/free_disk_space.sh
      - name: Run integration tests (partition ${{ matrix.partition }})
        run: |
          sub_modules=$(python tools/update_modules_check/update_modules_check.py \
            sub_update_it_module \
            '${{ needs.changes.outputs.it-modules }}' \
            8 ${{ matrix.partition }})
          if [ -n "$sub_modules" ]; then
            echo "Running modules: $sub_modules"
            ./mvnw -T 1 -B verify \
              -DskipUT=true \
              -DskipIT=false \
              -D"license.skipAddThirdParty"=true \
              -D"skip.ui"=true \
              --no-snapshot-updates \
              -pl "$sub_modules" -am -Pci
          else
            echo "Partition ${{ matrix.partition }}: no modules assigned, skipping."
          fi
        env:
          MAVEN_OPTS: -Xmx4096m

  engine-v2-it:
    name: Engine v2 integration test (Java ${{ matrix.java }})
    needs: [ build, changes ]
    if: >-
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.engine == 'true' ||
      needs.changes.outputs.engine-e2e == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '8', '11' ]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'
      - name: Restore build artifacts
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/apache/seatunnel
          key: seatunnel-m2-${{ github.run_id }}
          restore-keys: |
            seatunnel-m2-
      - name: Free disk space
        run: tools/github/free_disk_space.sh
      - name: Run engine integration tests
        run: |
          ./mvnw -T 1 -B verify \
            -DskipUT=true \
            -DskipIT=false \
            -D"license.skipAddThirdParty"=true \
            --no-snapshot-updates \
            -pl :connector-seatunnel-e2e-base,:connector-console-seatunnel-e2e \
            -am -Pci
        env:
          MAVEN_OPTS: -Xmx4096m

  engine-k8s-it:
    name: Engine k8s integration test (Java ${{ matrix.java }})
    needs: [ build, changes ]
    if: >-
      needs.changes.outputs.api == 'true' ||
      contains(needs.changes.outputs.it-modules, 'seatunnel-engine-k8s-e2e')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '8', '11' ]
    timeout-minutes: 45
    steps:
      - name: Install k3s
        run: |
          curl -sfL https://get.k3s.io | K3S_KUBECONFIG_MODE=777 sh -s - --docker
          mkdir -p ~/.kube
          cp /etc/rancher/k3s/k3s.yaml ~/.kube/config
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'
      - name: Restore build artifacts
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/apache/seatunnel
          key: seatunnel-m2-${{ github.run_id }}
          restore-keys: |
            seatunnel-m2-
      - name: Run k8s integration tests
        run: |
          ./mvnw -T 1 -B verify \
            -DskipUT=true \
            -DskipIT=false \
            -D"license.skipAddThirdParty"=true \
            -D"skip.ui"=true \
            --no-snapshot-updates \
            -pl :seatunnel-engine-k8s-e2e -am -Pci
        env:
          MAVEN_OPTS: -Xmx4096m
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml

  transform-v2-it:
    name: Transform-v2 integration test (Java ${{ matrix.java }}, partition ${{ matrix.partition }})
    needs: [ build, changes ]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '8', '11' ]
        partition: [ 1, 2 ]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'
      - name: Restore build artifacts
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/apache/seatunnel
          key: seatunnel-m2-${{ github.run_id }}
          restore-keys: |
            seatunnel-m2-
      - name: Free disk space
        run: tools/github/free_disk_space.sh
      - name: Run transform-v2 integration tests (partition ${{ matrix.partition }})
        run: |
          ./mvnw -B -T 1 verify \
            -DskipUT=true \
            -DskipIT=false \
            -D"license.skipAddThirdParty"=true \
            -D"skip.ui"=true \
            --no-snapshot-updates \
            -pl :seatunnel-transforms-v2-e2e-part-${{ matrix.partition }} \
            -am -Pci
        env:
          MAVEN_OPTS: -Xmx4096m

  all-connectors-it:
    name: All connectors integration test (Java ${{ matrix.java }}, partition ${{ matrix.partition }})
    needs: [ build, changes ]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '8', '11' ]
        partition: [ 0, 1, 2, 3, 4, 5, 6 ]
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'
      - name: Restore build artifacts
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/apache/seatunnel
          key: seatunnel-m2-${{ github.run_id }}
          restore-keys: |
            seatunnel-m2-
      - name: Free disk space
        run: tools/github/free_disk_space.sh
      - name: Run connector integration tests (partition ${{ matrix.partition }})
        run: |
          ./mvnw help:evaluate \
            -Dexpression=project.modules -q -DforceStdout \
            -pl :seatunnel-connector-v2-e2e \
            >> /tmp/sub_module.txt
          sub_modules=$(python tools/update_modules_check/update_modules_check.py \
            sub /tmp/sub_module.txt)
          run_it_modules=$(python tools/update_modules_check/update_modules_check.py \
            sub_it_module "$sub_modules" 7 ${{ matrix.partition }})
          ./mvnw -B -T 1 verify \
            -DskipUT=true \
            -DskipIT=false \
            -D"license.skipAddThirdParty"=true \
            -D"skip.ui"=true \
            --no-snapshot-updates \
            -pl "$run_it_modules" -am -Pci
        env:
          MAVEN_OPTS: -Xmx4096m

  jdbc-connectors-it:
    name: JDBC connectors integration test (Java ${{ matrix.java }}, partition ${{ matrix.partition }})
    needs: [ build, changes ]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '8', '11' ]
        partition: [ 1, 2, 3, 4, 5, 6, 7 ]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
