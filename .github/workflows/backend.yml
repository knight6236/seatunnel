name: Backend

on:
  workflow_call:
    inputs:
      TEST_IN_PR:
        required: false
        type: string
        default: 'true'

concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TEST_IN_PR: ${{ inputs.TEST_IN_PR }}

jobs:
  license-header:
    name: License header
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Check license header
        uses: apache/skywalking-eyes@v0.5.0

  code-style:
    name: Code style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Check code style
        run: ./mvnw --batch-mode --quiet --no-snapshot-updates clean spotless:check
      - name: Check code specification
        run: ./mvnw -B -T 2C clean test -D"license.skipAddThirdParty"=true -pl seatunnel-ci-tools -am --no-snapshot-updates
        env:
          MAVEN_OPTS: -Xmx512m
      - name: Check for .class files in git
        run: |
          echo "Checking for .class files tracked by git..."
          CLASS_FILES=$(git ls-files '*.class')
          if [ -n "$CLASS_FILES" ]; then
            echo "ERROR: The following .class files are tracked by git:"
            echo "$CLASS_FILES"
            exit 1
          else
            echo "No .class files found in git repository."
          fi

  helm-chart-check:
    name: Check Helm Chart Syntax
    needs: [ license-header, code-style ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Helm
        uses: azure/setup-helm@v4.3.0
      - name: Lint Chart
        run: helm lint deploy/kubernetes/seatunnel

  sanity-check:
    name: Sanity check results
    needs: [ license-header, code-style ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check results
        run: |
          [[ ${{ needs.license-header.result }} == 'success' ]] || exit 1;
          [[ ${{ needs.code-style.result }} == 'success' ]] || exit 1;

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      api: ${{ steps.filter.outputs.api }}
      engine: ${{ steps.filter.outputs.engine }}
      engine-e2e: ${{ steps.filter.outputs.engine-e2e }}
      docs: ${{ steps.filter.outputs.docs }}
      ut-modules: ${{ steps.ut-modules.outputs.modules }}
      it-modules: ${{ steps.it-modules.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '2000'
      - name: checkout apache seatunnel dev branch
        id: git_init
        run: |
          /usr/bin/git remote add apache https://github.com/apache/seatunnel
          /usr/bin/git -c protocol.version=2 fetch --no-tags --prune --no-recurse-submodules --depth=2000 apache +refs/heads/dev*:refs/remotes/apache/dev* +refs/tags/dev*:refs/tags/dev*
          /usr/bin/git checkout apache/dev
          /usr/bin/git checkout '${{ github.ref }}'
          echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11.0'
      - uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'
      - name: Check for file changes by python
        id: filter
        run: |
          current_branch='${{ steps.git_init.outputs.branch }}'
          pip install GitPython
          workspace="${GITHUB_WORKSPACE}"
          repository_owner="${GITHUB_REPOSITORY_OWNER}"
          cv2_files=`python tools/update_modules_check/check_file_updates.py ua $workspace apache/dev origin/$current_branch "seatunnel-connectors-v2/**"`
          echo "cv2=${cv2_files%%$'\n'*}" >> $GITHUB_OUTPUT
          echo "cv2_files=${cv2_files#*$'\n'}" >> $GITHUB_OUTPUT

          cv2_e2e_files=`python tools/update_modules_check/check_file_updates.py ua $workspace apache/dev origin/$current_branch "seatunnel-e2e/seatunnel-connector-v2-e2e/**"`
          echo "cv2-e2e=${cv2_e2e_files%%$'\n'*}" >> $GITHUB_OUTPUT
          echo "cv2-e2e_files=${cv2_e2e_files#*$'\n'}" >> $GITHUB_OUTPUT

          engine_files=`python tools/update_modules_check/check_file_updates.py ua $workspace apache/dev origin/$current_branch "seatunnel-engine/**"`
          echo "engine=${engine_files%%$'\n'*}" >> $GITHUB_OUTPUT
          echo "engine_files=${engine_files#*$'\n'}" >> $GITHUB_OUTPUT

          deleted_poms_files=`python tools/update_modules_check/check_file_updates.py d $workspace apache/dev origin/$current_branch "**/pom.xml"`
          echo "deleted-poms=${deleted_poms_files%%$'\n'*}" >> $GITHUB_OUTPUT
          echo "deleted-poms_files=${deleted_poms_files#*$'\n'}" >> $GITHUB_OUTPUT

          doc_files=`python tools/update_modules_check/check_file_updates.py ua $workspace apache/dev origin/$current_branch "docs/**"`
          echo "docs=${doc_files%%$'\n'*}" >> $GITHUB_OUTPUT
          echo "docs_files=${doc_files#*$'\n'}" >> $GITHUB_OUTPUT

          engine_e2e_files=`python tools/update_modules_check/check_file_updates.py ua $workspace apache/dev origin/$current_branch "seatunnel-e2e/seatunnel-engine-e2e/**"`
          echo "engine-e2e=${engine_e2e_files%%$'\n'*}" >> $GITHUB_OUTPUT
          echo "engine-e2e_files=${engine_e2e_files#*$'\n'}" >> $GITHUB_OUTPUT

          api_files=`python tools/update_modules_check/check_file_updates.py ua $workspace apache/dev origin/$current_branch "seatunnel-api/" "seatunnel-common/" "seatunnel-config/" "seatunnel-core/" "seatunnel-e2e/seatunnel-e2e-common/" "seatunnel-formats/" "seatunnel-plugin-discovery/" "seatunnel-transforms-v2/" "seatunnel-translation/" "seatunnel-e2e/seatunnel-transforms-v2-e2e/" "pom.xml" "/workflows/" "tools/" "seatunnel-dist/"`
          true_or_false=${api_files%%$'\n'*}
          file_list=${api_files#*$'\n'}

          if [[ $repository_owner == 'apache' && "$GITHUB_EVENT_NAME" != "pull_request" ]];then
            true_or_false='true'
          fi
          echo "api=$true_or_false" >> $GITHUB_OUTPUT
          echo "api_files=$file_list" >> $GITHUB_OUTPUT

      - name: Check Connector V2 Update
        id: cv2-modules
        if: ${{ steps.filter.outputs.cv2 == 'true' }}
        run: echo "modules=`python tools/update_modules_check/update_modules_check.py cv2 "${{ steps.filter.outputs.cv2_files }}"`" >> $GITHUB_OUTPUT

      - name: Check Connector V2 E2E Update
        id: cv2-e2e-modules
        if: ${{ steps.filter.outputs.cv2-e2e == 'true' }}
        run: echo "modules=`python tools/update_modules_check/update_modules_check.py cv2-e2e "${{ steps.filter.outputs.cv2-e2e_files }}"`" >> $GITHUB_OUTPUT

      - name: Check Engine Update
        id: engine-modules
        if: ${{ steps.filter.outputs.engine == 'true' }}
        run: echo "modules=`python tools/update_modules_check/update_modules_check.py engine "${{ steps.filter.outputs.engine_files }}"`" >> $GITHUB_OUTPUT

      - name: Check Engine E2E Update
        id: engine-e2e-modules
        if: ${{ steps.filter.outputs.engine-e2e == 'true' }}
        run: echo "modules=`python tools/update_modules_check/update_modules_check.py engine-e2e "${{ steps.filter.outputs.engine-e2e_files }}"`" >> $GITHUB_OUTPUT

      - name: Check Deleted Modules
        id: deleted-modules
        if: ${{ steps.filter.outputs.deleted-poms == 'true' }}
        run: echo "modules=`python tools/update_modules_check/update_modules_check.py delete "${{ steps.filter.outputs.deleted-poms_files }}"`" >> $GITHUB_OUTPUT

      - name: Make unit test modules
        id: ut-modules
        timeout-minutes: 60
        if: ${{ steps.filter.outputs.api == 'false' && (steps.engine-modules.outputs.modules != '' || steps.cv2-modules.outputs.modules != '') }}
        run: |
          modules='${{ steps.engine-modules.outputs.modules }}${{ steps.cv2-modules.outputs.modules }}'
          modules=${modules: 1}
          pl_modules=`python tools/update_modules_check/update_modules_check.py replace "$modules"`
          delete_modules='${{ steps.deleted-modules.outputs.modules }}'
          if [[ "zz"$delete_modules != "zz" ]];then
            pl_modules=`python tools/update_modules_check/update_modules_check.py rm "$pl_modules" "$delete_modules"`
          fi
          if [[ "zz"$pl_modules == "zz" ]];then exit 0; fi
          ./mvnw help:evaluate -Dexpression=project.modules -q -DforceStdout -pl $pl_modules > /tmp/sub_module.txt
          sub_modules=`python tools/update_modules_check/update_modules_check.py sub /tmp/sub_module.txt`
          includes=`python tools/update_modules_check/update_modules_check.py tree "$modules$sub_modules"`
          ./mvnw -Pci -D"e2e.dependency.skip"=false dependency:tree $includes -DoutputType=text -DoutputFile=/tmp/tree_out.txt
          build_modules=`python tools/update_modules_check/update_modules_check.py final_ut /tmp/tree_out.txt`
          if [[ "zz"$build_modules == "zz" ]];then build_modules=$pl_modules; fi
          echo "modules=$build_modules" >> $GITHUB_OUTPUT

      - name: Make integration test modules
        id: it-modules
        timeout-minutes: 60
        if: ${{ steps.filter.outputs.api == 'false' && (steps.engine-modules.outputs.modules != '' || steps.cv2-modules.outputs.modules != '' || steps.cv2-e2e-modules.outputs.modules != '') }}
        run: |
          modules='${{ steps.cv2-e2e-modules.outputs.modules }}${{ steps.engine-e2e-modules.outputs.modules }}${{ steps.engine-modules.outputs.modules }}${{ steps.cv2-modules.outputs.modules }}'
          modules=${modules: 1}
          pl_modules=`python tools/update_modules_check/update_modules_check.py replace "$modules"`
          delete_modules='${{ steps.deleted-modules.outputs.modules }}'
          if [[ "zz"$delete_modules != "zz" ]];then
            pl_modules=`python tools/update_modules_check/update_modules_check.py rm "$pl_modules" "$delete_modules"`
          fi
          if [[ "zz"$pl_modules == "zz" ]];then exit 0; fi
          ./mvnw help:evaluate -Dexpression=project.modules -q -DforceStdout -pl $pl_modules > /tmp/sub_module.txt
          sub_modules=`python tools/update_modules_check/update_modules_check.py sub /tmp/sub_module.txt`
          includes=`python tools/update_modules_check/update_modules_check.py tree "$modules$sub_modules"`
          ./mvnw -Pci -D"e2e.dependency.skip"=false dependency:tree $includes -DoutputType=text -DoutputFile=/tmp/tree_out.txt
          build_modules=`python tools/update_modules_check/update_modules_check.py final_it /tmp/tree_out.txt`
          echo "modules=$build_modules" >> $GITHUB_OUTPUT

  build:
    name: Compile and Install
    needs: [ changes, sanity-check ]
    if: >-
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.engine == 'true' ||
      needs.changes.outputs.engine-e2e == 'true' ||
      needs.changes.outputs.ut-modules != '' ||
      needs.changes.outputs.it-modules != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build and install all modules
        run: |
          ./mvnw -B -T 2C clean install \
            -DskipTests \
            -D"license.skipAddThirdParty"=true \
            -D"skip.ui"=true -Pci
      - name: Clean unnecessary artifacts before caching
        run: |
          cd ~/.m2/repository/org/apache/seatunnel
          find . -name "*-sources.jar" -delete
          find . -name "*-javadoc.jar" -delete
          find . -name "*-tests.jar" -delete
          find . -name "_remote.repositories" -delete
          find . -name "*.lastUpdated" -delete
          echo "Cached artifact size:"
          du -sh .
      - name: Cache seatunnel artifacts
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository/org/apache/seatunnel
          key: seatunnel-m2-${{ github.run_id }}

  dependency-license:
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.engine == 'true'
    needs: [ build, changes ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'
      - name: Restore seatunnel artifacts
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/apache/seatunnel
          key: seatunnel-m2-${{ github.run_id }}
      - name: Check Dependencies Licenses
        run: tools/dependencies/checkLicense.sh

  document:
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.docs == 'true'
    needs: [ changes, sanity-check ]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: seatunnel-pr
      - uses: actions/checkout@v4
        with:
          repository: apache/seatunnel-website
          path: seatunnel-website
      - run: bash seatunnel-pr/tools/documents/sync.sh seatunnel-pr seatunnel-website
      - uses: actions/setup-node@v4
        with:
          node-version: 18.20.7
      - run: |
          cd seatunnel-website && npm set strict-ssl false && npm install && npm run build

  seatunnel-ui:
    if: needs.changes.outputs.api == 'true'
    needs: [ changes, sanity-check ]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - run: cd seatunnel-engine/seatunnel-engine-ui/ && npm install && npm run lint && npm run test:unit && npm run build

  unit-test:
    needs: [ build, changes ]
    if: needs.changes.outputs.api == 'true' || (needs.changes.outputs.api == 'false' && needs.changes.outputs.ut-modules != '')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        java: [ '8', '11' ]
        os: [ 'ubuntu-latest', 'windows-latest' ]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'
      - name: Restore seatunnel artifacts
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/apache/seatunnel
          key: seatunnel-m2-${{ github.run_id }}
      - name: Run all modules unit test
        run: ./mvnw -B -T 2C verify -DskipUT=false -DskipIT=true -D"license.skipAddThirdParty"=true -D"skip.ui"=true --no-snapshot-updates
        env:
          MAVEN_OPTS: -Xmx4096m

  updated-modules-integration-test:
    needs: [ build, changes ]
    if: needs.changes.outputs.api == 'false' && needs.changes.outputs.engine == 'false' && needs.changes.outputs.it-modules != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '8', '11' ]
        partition: [ 0, 1, 2, 3, 4, 5, 6, 7 ]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'
      - name: Restore seatunnel artifacts
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/apache/seatunnel
          key: seatunnel-m2-${{ github.run_id }}
      - name: free disk space
        run: tools/github/free_disk_space.sh
      - name: Run updated modules IT partition ${{ matrix.partition }}
        run: |
          sub_modules=`python tools/update_modules_check/update_modules_check.py sub_update_it_module ${{needs.changes.outputs.it-modules}} 8 ${{ matrix.partition }}`
          if [ ! -z "$sub_modules" ]; then
            echo "Running: $sub_modules"
            ./mvnw -T 1 -B verify \
              -DskipUT=true -DskipIT=false \
              -D"license.skipAddThirdParty"=true \
              -D"skip.ui"=true \
              --no-snapshot-updates \
              -pl "$sub_modules" -am -Pci
          else
            echo "sub modules is empty, skipping"
          fi
        env:
          MAVEN_OPTS: -Xmx4096m

  engine-v2-it:
    needs: [ build, changes ]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.engine == 'true' || needs.changes.outputs.engine-e2e == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '8', '11' ]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'
      - name: Restore seatunnel artifacts
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/apache/seatunnel
          key: seatunnel-m2-${{ github.run_id }}
      - name: free disk space
        run: tools/github/free_disk_space.sh
      - name: Run seatunnel zeta integration test
        run: |
          ./mvnw -T 1 -B verify \
            -DskipUT=true -DskipIT=false \
            -D"license.skipAddThirdParty"=true \
            --no-snapshot-updates \
            -pl :connector-seatunnel-e2e-base,:connector-console-seatunnel-e2e \
            -am -Pci
        env:
          MAVEN_OPTS: -Xmx4096m

  engine-k8s-it:
    needs: [ build, changes ]
    if: needs.changes.outputs.api == 'true' || contains(needs.changes.outputs.it-modules, 'seatunnel-engine-k8s-e2e')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '8', '11' ]
    timeout-minutes: 45
    steps:
      - name: Install k3s
        run: |
          curl -sfL https://get.k3s.io | K3S_KUBECONFIG_MODE=777 sh -s - --docker
          mkdir -p ~/.kube && cp /etc/rancher/k3s/k3s.yaml ~/.kube/config
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'
      - name: Restore seatunnel artifacts
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/apache/seatunnel
          key: seatunnel-m2-${{ github.run_id }}
      - name: Run seatunnel zeta on k8s test
        run: |
          ./mvnw -T 1 -B verify \
            -DskipUT=true -DskipIT=false \
            -D"license.skipAddThirdParty"=true \
            -D"skip.ui"=true \
            --no-snapshot-updates \
            -pl :seatunnel-engine-k8s-e2e -am -Pci
        env:
          MAVEN_OPTS: -Xmx4096m
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml

  transform-v2-it:
    needs: [ build, changes ]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '8', '11' ]
        partition: [ 1, 2 ]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'
      - name: Restore seatunnel artifacts
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/apache/seatunnel
          key: seatunnel-m2-${{ github.run_id }}
      - name: free disk space
        run: tools/github/free_disk_space.sh
      - name: Run transform-v2 IT partition ${{ matrix.partition }}
        run: |
          ./mvnw -B -T 1 verify \
            -DskipUT=true -DskipIT=false \
            -D"license.skipAddThirdParty"=true \
            -D"skip.ui"=true \
            --no-snapshot-updates \
            -pl :seatunnel-transforms-v2-e2e-part-${{ matrix.partition }} \
            -am -Pci
        env:
          MAVEN_OPTS: -Xmx4096m

  all-connectors-it:
    needs: [ build, changes ]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '8', '11' ]
        partition: [ 0, 1, 2, 3, 4, 5, 6 ]
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'
      - name: Restore seatunnel artifacts
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/apache/seatunnel
          key: seatunnel-m2-${{ github.run_id }}
      - name: free disk space
        run: tools/github/free_disk_space.sh
      - name: Run connector-v2 IT partition ${{ matrix.partition }}
        run: |
          ./mvnw help:evaluate -Dexpression=project.modules -q -DforceStdout -pl :seatunnel-connector-v2-e2e >> /tmp/sub_module.txt
          sub_modules=`python tools/update_modules_check/update_modules_check.py sub /tmp/sub_module.txt`
          run_it_modules=`python tools/update_modules_check/update_modules_check.py sub_it_module "$sub_modules" 7 ${{ matrix.partition }}`
          ./mvnw -B -T 1 verify \
            -DskipUT=true -DskipIT=false \
            -D"license.skipAddThirdParty"=true \
            -D"skip.ui"=true \
            --no-snapshot-updates \
            -pl $run_it_modules -am -Pci
        env:
          MAVEN_OPTS: -Xmx4096m

  jdbc-connectors-it:
    needs: [ build, changes ]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '8', '11' ]
        partition: [ 1, 2, 3, 4, 5, 6, 7 ]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'
      - name: Restore seatunnel artifacts
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/apache/seatunnel
          key: seatunnel-m2-${{ github.run_id }}
      - name: free disk space
        run: tools/github/free_disk_space.sh
      - name: Run jdbc connectors IT partition ${{ matrix.partition }}
        run: |
          ./mvnw -B -T 1 verify \
            -DskipUT=true -DskipIT=false \
            -D"license.skipAddThirdParty"=true \
            -D"skip.ui"=true \
            --no-snapshot-updates \
            -pl :connector-jdbc-e2e-part-${{ matrix.partition }} \
            -am -Pci
        env:
          MAVEN_OPTS: -Xmx4096m

  jdbc-connectors-it-ddl:
    needs: [ build, changes ]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '8', '11' ]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v3
        with:
